<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Rkitect Asset Showcase</title><style>
:root{color-scheme:dark;--bg:#0e1116;--card:#171b22;--line:#262c36;--fg:#e8ecf1;--mut:#8b95a5;--acc:#4da3ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:32px 24px 8px;max-width:1200px;margin:auto}h1{margin:0 0 4px;font-size:26px}
.sub{color:var(--mut);font-size:14px}.bar{max-width:1200px;margin:16px auto;padding:0 24px;display:flex;gap:12px;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:10px 12px;border-radius:8px;font-size:14px}
input{flex:1;min-width:200px}
.grid{max-width:1200px;margin:auto;padding:0 24px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.thumb{aspect-ratio:1;background:#0b0d11;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:12px 14px}
.name{font-weight:600}.meta{color:var(--mut);font-size:12px;margin-top:4px}
.badge{float:right;font-size:12px;padding:2px 8px;border-radius:999px;background:#12331f;color:#5fd38d}
.badge.mid{background:#3a2f12;color:#e2b84a}.tag{display:inline-block;font-size:11px;color:var(--mut);margin:6px 6px 0 0}
a{color:var(--acc)}.wrap{max-width:1200px;margin:auto;padding:16px 24px}
.maps{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;font-size:12px;color:var(--mut)}
figure img{width:240px;border-radius:8px;border:1px solid var(--line);display:block}
model-viewer{width:100%;height:70vh;background:#0b0d11;border-radius:12px}
</style><header><h1>Rkitect Asset Showcase</h1><div class=sub>2 validated, commercially usable assets collected by the Rkitect crawler</div></header><div class=bar><input id=q placeholder='Search assets or tags...'><select id=c><option value=''>All categories</option><option>Furniture</option><option>Materials</option></select></div><div class=grid id=g><a class=card href='assets/furniture/wooden_table_02/preview.html' data-cat='Furniture' data-q='wooden table 02 wooden worn village rural natural simple'><div class=thumb><img loading=lazy src='assets/furniture/wooden_table_02/textures/wooden_table_02_diff_2k.jpg'></div><div class=body><span class='badge'>93</span><div class=name>Wooden Table 02</div><div class=meta>3D model &middot; Furniture &middot; CC0</div><span class=tag>#wooden</span><span class=tag>#worn</span><span class=tag>#village</span><span class=tag>#rural</span></div></a><a class=card href='assets/materials/tiles074/preview.html' data-cat='Materials' data-q='tiles074 74 floor marble stone tiled tiles tiling'><div class=thumb><img loading=lazy src='assets/materials/tiles074/Tiles074.png'></div><div class=body><span class='badge'>92</span><div class=name>Tiles074</div><div class=meta>Material &middot; Materials &middot; CC0</div><span class=tag>#74</span><span class=tag>#floor</span><span class=tag>#marble</span><span class=tag>#stone</span></div></a></div><script>const q=document.getElementById('q'),c=document.getElementById('c'),cs=[...document.querySelectorAll('.card')];function f(){cs.forEach(x=>x.style.display=(x.dataset.q.includes(q.value.toLowerCase())&&(!c.value||x.dataset.cat===c.value))?'':'none')}q.oninput=f;c.onchange=f;</script>
